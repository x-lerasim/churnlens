# ChurnLens: ClickHouse + Airflow + генератор (python) + dbt
# cp .env.example .env  →  docker compose --profile tools build  →  docker compose up -d --build

x-airflow-common: &airflow-common
  image: churnlens/airflow:3.1.8
  user: "${AIRFLOW_UID}:0"
  group_add: ["${DOCKER_GID}"]                 # доступ к docker.sock для DockerOperator
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Moscow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 8123
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./data:/opt/airflow/data:ro
    - /var/run/docker.sock:/var/run/docker.sock
  networks: [churnlens]
  depends_on: &airflow-deps
    airflow-postgres: { condition: service_healthy }
    clickhouse: { condition: service_healthy }

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.16.34
    environment:
      CLICKHOUSE_DB: raw
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./data/raw:/var/lib/clickhouse/user_files/raw:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -u $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD -q 'SELECT 1'"]
      interval: 10s
      retries: 10
    networks: [churnlens]
    restart: unless-stopped

  airflow-postgres:
    image: postgres:17.2
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 10
    networks: [churnlens]
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    build: ./airflow
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      <<: *airflow-deps
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-deps
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-deps
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # --- образы задач: собираются, но не запускаются при up (их запускает DAG) ---
  generator:
    build: ./generator
    image: churnlens/generator:1.0
    profiles: [tools]
    user: "${AIRFLOW_UID}:0"
    network_mode: none
    volumes:
      - ./data/raw:/data/out

  dbt:
    build: ./dbt
    image: churnlens/dbt:1.0
    profiles: [tools]
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
    volumes:
      - ./dbt:/dbt
    networks: [churnlens]

volumes:
  ch_data:
  pg_data:

networks:
  churnlens:
    name: churnlens          # фиксированное имя: в него DAG подключает контейнер dbt
